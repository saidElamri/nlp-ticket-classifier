apiVersion: batch/v1
kind: CronJob
metadata:
  name: nlp-pipeline-cronjob
  labels:
    app: nlp-pipeline
spec:
  schedule: "0 2 * * 0"  # Every Sunday at 02:00
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: nlp-pipeline
        spec:
          restartPolicy: Never
          containers:
            - name: nlp-pipeline
              image: nlp-pipeline:v1.0.0
              imagePullPolicy: IfNotPresent
              resources:
                requests:
                  memory: "1Gi"
                  cpu: "500m"
                limits:
                  memory: "4Gi"
                  cpu: "2"
              volumeMounts:
                - name: model-cache
                  mountPath: /root/.cache/huggingface
          volumes:
            - name: model-cache
              persistentVolumeClaim:
                claimName: nlp-model-cache-pvc
